<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaunchCode Automobile Company</title>
</head>

<body>
    <header>
        <h1>Welcome to LaunchCode Automobile Company</h1>
    </header>

    <main>
        <section id="feedback">
            <form action="/submit" method="post">
                <fieldset>
                    <legend>Feedback</legend>
                    
                    <label for="name">Name:</label>
                    <input type="text" 
                            id="name" 
                            name="name" 
                            required 
                            size="100"
                            maxlength="100"
                            placeholder="Enter your full name" />
                    <br>    

                    <label for="email">Email:</label>
                    <input type="email" 
                            id="email" 
                            name="email" 
                            required 
                            size="100"
                            placeholder="example@example.com"
                            minlength="5" />
                    <br>

                    <label for="password">Password:</label>
                    <input type="password"
                            id="password"
                            name="password"
                            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*_=+]).{8,}" 
                            title="Must contain at least one number, one uppercase letter, one lowercase letter, one special character, and at least 8 or more characters"   
                            placeholder="Enter your password"
                            minlength="8"
                            required />
                    <br>        

                    <label for="feedbackCategory">Feedback Category:</label>
                    <select id="feedbackCategory" 
                            name="feedbackCategory"
                            required>
                        <option value="" selected>Please select...</option>    
                        <option value="product">Product</option>
                        <option value="service">Service</option>
                        <option value="shipping">Shipping</option>    
                    </select>
                    <br>

                    <fieldset>
                        <legend>Preferred Contact Method:</legend>
                    
                        <label for="email">
                            <input type="radio" 
                                id="email" 
                                name="contact" 
                                value="email"
                                checked />
                            Email    
                        </label>

                        <label for="phone">
                            <input type="radio"
                                id="phone"
                                name="contact"
                                value="phone" />
                            Phone
                        </label>
                    </fieldset>
                    <br>

                    <fieldset>
                        <legend>Additional Features of Interest</legend>

                        <label for="additionalColors">
                            <input type="checkbox"
                                id="additionalColors"
                                name="features"
                                value="additionalColors"
                                checked />
                            Additional Colors
                        </label>

                        <label for="optionalWheels">
                            <input type="checkbox"
                                id="optionalWheels"
                                name="features"
                                value="optionalWheels" />
                            Optional Wheels
                        </label>
                    </fieldset>
                    <br>

                    <label for="comments">Comments:</label>
                    <textarea id="comments"
                        name="comments"
                        rows="5"
                        cols="30"
                        placeholder="Write your message here"
                        maxlength="200"
                        required></textarea>
                    <br>

                    <input type="submit" value="Submit" />
                </fieldset>
            </form>
        </section>
    </main>

</body>

</html>
